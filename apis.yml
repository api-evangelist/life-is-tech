aid: life-is-tech
name: Life is Tech
description: >-
  Life is Tech, Inc. (ライフイズテック株式会社) is a Tokyo-based education technology
  company founded on 6 July 2010 by Yusuke Mizuno, delivering digital, programming and
  AI education to Japanese teenagers, schools, municipalities and employers. Its
  products are "Life is Tech !" IT camps and year-round schools for junior and senior
  high school students, "Life is Tech ! Lesson" — a cloud-based information and
  programming curriculum used by roughly 4,000 public and private schools across some
  600 municipalities — "Life is Tech ! Leaders" for university students, "Life is Tech !
  Career" digital job-hunting support, and DX Readiness corporate digital-skills
  training. The company is a certified B Corporation (October 2022, the first Japanese
  EdTech to certify) and holds the PrivacyMark. Life is Tech sells finished learning
  products to schools and consumers; it publishes no public developer program, API,
  SDK or machine-readable contract.
